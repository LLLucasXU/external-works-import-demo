<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外部作品导入管理 Demo</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --line: #e4eaf0;
      --line-strong: #cbd5df;
      --text: #162232;
      --muted: #667385;
      --subtle: #8a95a5;
      --brand: #12677f;
      --brand-dark: #0b4a5d;
      --accent: #d66b36;
      --green: #1f7a55;
      --blue: #2568d8;
      --red: #c93f45;
      --amber: #9a6500;
      --shadow: 0 18px 50px rgba(22, 34, 51, .10);
      --radius: 8px;
      --demo-scale: .8;
      --scaled-viewport: 125vh;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html {
      overflow-x: hidden;
    }

    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: hidden;
      background:
        linear-gradient(180deg, rgba(23, 107, 135, .08), transparent 260px),
        var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: calc(100vw / var(--demo-scale));
      height: var(--scaled-viewport);
      min-height: var(--scaled-viewport);
      display: grid;
      grid-template-rows: 64px 1fr;
      overflow: hidden;
      transform: scale(var(--demo-scale));
      transform-origin: top left;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(255, 255, 255, .88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1;
    }

    .brand span {
      color: var(--muted);
      margin-left: 8px;
      font-weight: 400;
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-chip {
      color: var(--muted);
      border: 1px solid var(--line);
      background: #fff;
      padding: 8px 12px;
      border-radius: 999px;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px minmax(760px, 1fr);
      gap: 16px;
      padding: 16px 32px 24px;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar,
    .content {
      background: rgba(255,255,255,.92);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 30px rgba(27, 41, 56, .07);
    }

    .sidebar {
      padding: 16px;
      height: auto;
      min-height: 0;
      position: sticky;
      top: 80px;
      overflow: auto;
    }

    .side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .side-head h2,
    .table-title h2 {
      margin: 0;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #344054;
      font-weight: 700;
      font-size: 13px;
    }

    .control,
    textarea {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      padding: 9px 11px;
      outline: none;
      transition: border-color .16s, box-shadow .16s;
    }

    textarea {
      min-height: 98px;
      resize: vertical;
    }

    .control:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(23, 107, 135, .12);
    }

    .check-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      color: #344054;
    }

    .check-grid label {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      font-weight: 500;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line-strong);
      font-weight: 700;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--brand);
      color: var(--brand-dark);
    }

    .btn.primary {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .btn.primary:hover {
      background: var(--brand-dark);
      color: #fff;
    }

    .btn.danger {
      color: var(--red);
      border-color: rgba(201, 68, 68, .35);
    }

    .btn.ghost {
      border-color: transparent;
      background: transparent;
    }

    .btn.icon {
      width: 34px;
      min-height: 34px;
      padding: 0;
      font-size: 16px;
    }

    .filter-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .content {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .content-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .table-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .table-title small {
      color: var(--muted);
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
      background: #fff;
    }

    .view-toggle button {
      height: 34px;
      padding: 0 12px;
      background: #fff;
      color: var(--muted);
      border-right: 1px solid var(--line);
    }

    .view-toggle button:last-child {
      border-right: 0;
    }

    .view-toggle .active {
      background: #e9f3f6;
      color: var(--brand-dark);
      font-weight: 800;
    }

    .table-wrap {
      overflow: auto;
      min-height: 0;
      max-height: 100%;
      scrollbar-gutter: stable;
    }

    .table-wrap::-webkit-scrollbar {
      height: 12px;
      width: 12px;
    }

    .table-wrap::-webkit-scrollbar-track {
      background: #eef2f5;
      border-radius: 999px;
    }

    .table-wrap::-webkit-scrollbar-thumb {
      background: #9aa3ad;
      border-radius: 999px;
      border: 2px solid #eef2f5;
    }

    .series-workspace {
      display: grid;
      grid-template-columns: 280px minmax(680px, 1fr);
      height: 100%;
      min-height: 0;
      overflow: hidden;
      transition: grid-template-columns .18s ease;
    }

    .series-workspace.nav-compact {
      grid-template-columns: 140px minmax(680px, 1fr);
    }

    .series-nav {
      border-right: 1px solid var(--line);
      background: #fbfcfd;
      overflow: auto;
      padding: 12px;
      height: 100%;
      min-height: 0;
      transition: padding .18s ease;
    }

    .series-nav-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .series-nav-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .series-nav-title span:first-child {
      white-space: nowrap;
    }

    .series-nav-toggle {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      background: #fff;
      border: 1px solid var(--line-strong);
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .series-nav-toggle:hover {
      border-color: var(--brand);
      background: #eaf5f8;
    }

    .series-nav-item {
      width: 100%;
      display: block;
      text-align: left;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
    }

    .series-nav-item:hover {
      background: #f1f6f8;
    }

    .series-nav-item.active {
      background: #eaf5f8;
      border-color: #c8e1e8;
      box-shadow: inset 3px 0 0 var(--brand);
    }

    .series-nav-item strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .series-nav-item small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      line-height: 1.45;
    }

    .series-workspace.nav-compact .series-nav {
      padding: 12px 8px;
    }

    .series-workspace.nav-compact .series-nav-title span:first-child,
    .series-workspace.nav-compact #seriesNavCount,
    .series-workspace.nav-compact .series-nav-item small {
      display: none;
    }

    .series-workspace.nav-compact .series-nav-head {
      justify-content: flex-end;
    }

    .series-workspace.nav-compact .series-nav-item {
      padding: 10px 8px;
    }

    .series-workspace.nav-compact .series-nav-item strong {
      font-size: 13px;
      line-height: 1.35;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .episode-detail {
      min-width: 0;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      background: #fff;
    }

    .detail-summary-card {
      display: grid;
      grid-template-columns: 72px minmax(260px, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .poster {
      width: 56px;
      height: 72px;
      border-radius: 7px;
      border: 1px solid var(--line);
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      background:
        linear-gradient(145deg, rgba(0, 0, 0, .08), rgba(0, 0, 0, .42)),
        linear-gradient(145deg, #12677f, #d66b36);
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .detail-summary-main h3 {
      margin: 0;
      font-size: 18px;
    }

    .detail-summary-main p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .detail-summary-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .detail-table-wrap {
      height: 100%;
      min-height: 0;
    }

    .detail-table-wrap table {
      min-width: 2200px;
    }

    .detail-table-wrap th.col-actions,
    .detail-table-wrap td.col-actions {
      position: sticky;
      right: 0;
      z-index: 1;
      background: #fff;
      box-shadow: -10px 0 18px rgba(20, 35, 55, .05);
    }

    .detail-table-wrap th.col-actions {
      z-index: 3;
      background: #f8fafc;
    }

    .inline-cell {
      border-radius: 6px;
      padding: 4px 6px;
      margin: -4px -6px;
      cursor: text;
    }

    .inline-cell:hover {
      background: #f0f6f8;
      outline: 1px dashed #b8d3dc;
    }

    .inline-input {
      width: 100%;
      height: 32px;
      border: 1px solid var(--brand);
      border-radius: 6px;
      padding: 0 8px;
      outline: 0;
      box-shadow: 0 0 0 3px rgba(18, 103, 127, .12);
    }

    .cell-flash {
      animation: cellFlash .8s ease;
    }

    @keyframes cellFlash {
      0% { background: #e7f7ef; }
      100% { background: transparent; }
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      min-width: 1410px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 46px;
      padding: 0 14px;
      background: #f8fafc;
      color: #344054;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    td {
      height: 76px;
      padding: 10px 14px;
      border-bottom: 1px solid #edf1f5;
      vertical-align: middle;
      background: rgba(255,255,255,.94);
      overflow: hidden;
    }

    tr:hover td {
      background: #fbfcfd;
    }

    .col-preview,
    .col-episode,
    .col-type,
    .col-status,
    .col-likes,
    .col-source,
    .col-actions {
      text-align: center;
    }

    .col-likes {
      font-variant-numeric: tabular-nums;
    }

    .col-id,
    .col-uid {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .col-preview .thumb {
      margin: 0 auto;
    }

    .series-row td {
      height: 62px;
      padding: 10px 14px;
      background: #f1f8fa;
      border-top: 1px solid #cfdee4;
      border-bottom: 1px solid #cfdee4;
      overflow: visible;
    }

    .series-row:hover td {
      background: #edf5f7;
    }

    .series-summary {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) 110px minmax(240px, .9fr) auto;
      gap: 16px;
      align-items: center;
      min-width: 1320px;
    }

    .series-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 260px;
    }

    .series-title strong {
      display: block;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
    }

    .expand {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      color: var(--brand-dark);
      background: #fff;
      border: 1px solid #bad2da;
      flex: 0 0 auto;
    }

    .meta-line {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .thumb {
      width: 46px;
      height: 58px;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      background:
        linear-gradient(135deg, rgba(0,0,0,.1), rgba(0,0,0,.45)),
        linear-gradient(135deg, #176b87, #e16f3d);
    }

    .thumb.loading {
      background:
        repeating-linear-gradient(135deg, #edf1f4 0 8px, #dfe5ea 8px 16px);
      color: #5d6978;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .pill.parsing { color: var(--blue); background: #eaf1ff; border-color: #bfd2ff; }
    .pill.review { color: var(--amber); background: #fff6df; border-color: #f5d992; }
    .pill.published { color: var(--green); background: #e7f7ef; border-color: #bce5cf; }
    .pill.offline { color: #667085; background: #eef1f4; border-color: #d7dde4; }
    .pill.failed { color: var(--red); background: #fff0f0; border-color: #fac6c6; }
    .pill.kind { color: #8d4f00; background: #fff1df; border-color: #f1c896; }
    .pill.source { color: var(--brand-dark); background: #e9f3f6; border-color: #c4dee6; }

    .status-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 220px;
      align-items: center;
      justify-content: flex-start;
    }

    .series-metrics {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .table-select {
      display: inline-block;
      width: 106px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid #cdd7e1;
      padding: 0 30px 0 14px;
      background: #fff;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      outline: none;
      text-align: left;
      max-width: 100%;
      transition: box-shadow .16s, border-color .16s, transform .16s;
    }

    .table-select:hover {
      transform: translateY(-1px);
    }

    .table-select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(18, 103, 127, .14);
    }

    .table-select.kind-select {
      color: #8d4f00;
      background-color: #fff1df;
      border-color: #f1c896;
    }

    .table-select.source-select {
      color: var(--brand-dark);
      background-color: #e9f3f6;
      border-color: #c4dee6;
    }

    .table-select.status-select {
      width: 128px;
    }

    .table-select.tag-select {
      width: 220px;
    }

    .table-select.status-select[data-status="审核中"] { color: var(--blue); background-color: #eaf1ff; border-color: #bfd2ff; }
    .table-select.status-select[data-status="公开可见"] { color: var(--green); background-color: #e7f7ef; border-color: #bce5cf; }
    .table-select.status-select[data-status="下线（不可见）"],
    .table-select.status-select[data-status="下架（不公开）"],
    .table-select.status-select[data-status="用户自见"] { color: #667085; background-color: #eef1f4; border-color: #d7dde4; }
    .table-select.status-select[data-status="审核不通过"],
    .table-select.status-select[data-status="发布失败"] { color: var(--red); background-color: #fff0f0; border-color: #fac6c6; }

    .row-actions,
    .group-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .group-actions {
      justify-content: flex-end;
    }

    .link-btn {
      background: transparent;
      color: var(--brand-dark);
      font-weight: 800;
      padding: 4px 0;
      white-space: nowrap;
    }

    .link-btn.danger {
      color: var(--red);
    }

    .empty {
      padding: 64px 20px;
      text-align: center;
      color: var(--muted);
    }

    .modal-backdrop,
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(16, 24, 40, .42);
      display: none;
      z-index: 30;
    }

    .modal-backdrop.show,
    .drawer-backdrop.show {
      display: block;
    }

    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(var(--demo-scale));
      transform-origin: center;
      width: min(1120px, calc(100vw - 36px));
      max-height: calc((100vh - 48px) / var(--demo-scale));
      overflow: hidden;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: none;
      z-index: 40;
    }

    .modal.show {
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .confirm-modal {
      width: min(470px, calc(100vw - 36px));
    }

    .modal-head,
    .drawer-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .modal-head h3,
    .drawer-head h3 {
      margin: 0;
      font-size: 18px;
    }

    .modal-body {
      padding: 18px 20px;
      overflow: auto;
    }

    .modal-foot,
    .drawer-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #fbfcfd;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .series-info-grid {
      grid-template-columns: minmax(190px, 1fr) minmax(190px, 1fr) minmax(190px, 1fr) minmax(240px, 1.1fr);
      align-items: stretch;
    }

    .series-info-grid .form-group {
      margin-bottom: 0;
      display: grid;
      grid-template-rows: 24px 76px;
      align-items: start;
    }

    .series-info-grid .form-group label:not(.poster-uploader) {
      margin-bottom: 0;
      display: flex;
      align-items: center;
    }

    .series-info-grid .control,
    .series-info-grid textarea,
    .series-info-grid .poster-uploader {
      height: 76px;
      min-height: 76px;
    }

    .series-info-grid input.control {
      padding-top: 0;
      padding-bottom: 0;
    }

    .series-info-grid textarea {
      resize: none;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      background: #fff;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }

    .section-title h4 {
      margin: 0;
      font-size: 15px;
    }

    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
    }

    .segmented button {
      height: 36px;
      padding: 0 16px;
      background: #fff;
      border-right: 1px solid var(--line);
      color: var(--muted);
      font-weight: 800;
    }

    .segmented button:last-child {
      border-right: 0;
    }

    .segmented button.active {
      background: var(--brand);
      color: #fff;
    }

    .upload-zone {
      min-height: 132px;
      border: 1px dashed #aab6c4;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      background: #fbfcfd;
      padding: 20px;
    }

    .upload-zone strong {
      color: var(--brand-dark);
      display: block;
      margin-bottom: 6px;
    }

    .poster-uploader {
      min-height: 76px;
      border: 1px dashed #aab6c4;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: var(--brand-dark);
      background: #f8fbfc;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      padding: 10px;
    }

    .poster-uploader span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .episode-editor {
      display: grid;
      grid-template-columns: 104px minmax(240px, 1fr) minmax(360px, 1.2fr) 42px;
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-soft);
    }

    .episode-editor .form-group {
      margin-bottom: 0;
    }

    .episode-editor textarea {
      min-height: 38px;
      height: 38px;
    }

    .upload-cell {
      min-height: 96px;
      border: 1px solid #d7dfe8;
      border-radius: 7px;
      background: #fff;
      padding: 8px;
      overflow: hidden;
    }

    .mini-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    .mini-tabs button {
      height: 28px;
      border-radius: 6px;
      background: #eef2f5;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .mini-tabs button.active {
      background: var(--brand);
      color: #fff;
    }

    .compact-file {
      display: grid;
      place-items: center;
      min-height: 38px;
      padding: 6px 8px;
      border: 1px dashed #aab6c4;
      border-radius: 6px;
      color: var(--brand-dark);
      background: #f8fbfc;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
    }

    .upload-file-name {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .episode-edit-grid {
      display: grid;
      grid-template-columns: 120px minmax(220px, 1fr) 130px 150px;
      gap: 12px;
      align-items: start;
    }

    .episode-edit-grid .form-group {
      margin-bottom: 0;
    }

    .episode-edit-grid .wide {
      grid-column: span 2;
    }

    .episode-edit-grid .upload-cell {
      min-height: 116px;
    }

    .episode-edit-grid .compact-file {
      min-height: 40px;
    }

    .episode-edit-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: min(520px, 96vw);
      background: #fff;
      box-shadow: var(--shadow);
      transform: translateX(104%);
      transition: transform .22s ease;
      z-index: 45;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .drawer.show {
      transform: translateX(0);
    }

    .drawer-body {
      padding: 18px 20px;
      overflow: auto;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: #17202a;
      color: #fff;
      padding: 10px 14px;
      border-radius: 7px;
      box-shadow: var(--shadow);
      transition: opacity .18s, transform .18s;
      z-index: 70;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .muted {
      color: var(--muted);
    }

    .nowrap {
      white-space: nowrap;
    }

    .truncate {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
      }

      .grid-4,
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .episode-editor {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

        workId: $("filterWorkId").value.trim(),
        uid: $("filterUid").value.trim(),
        seriesId: $("filterSeriesId").value.trim(),
        source: $("filterSource").value,
        tag: $("filterTag").value,
        statuses: [...$("statusFilters").querySelectorAll("input:checked")].map((item) => item.value)
      };
    }

    function matchesFilters(series, filters) {
      const allEpisodes = series.episodes;
      if (filters.scene !== "剧场") return false;
      if (filters.uid && !series.authorUid.includes(filters.uid)) return false;
      if (filters.seriesId) {
        const tokens = filters.seriesId.split(/[\s,，]+/).filter(Boolean);
        if (!tokens.some((token) => series.id.includes(token))) return false;
      }
      if (filters.source && !allEpisodes.some((ep) => ep.source === filters.source)) return false;
      if (filters.tag && !allEpisodes.some((ep) => ep.tag === filters.tag)) return false;
      if (filters.workId) {
        const tokens = filters.workId.split(/[\s,，]+/).filter(Boolean);
        if (!tokens.some((token) => allEpisodes.some((ep) => ep.id.includes(token)))) return false;
      }
      if (filters.statuses.length && !allEpisodes.some((ep) => filters.statuses.includes(ep.status))) return false;
      return true;
    }

    function matchesEpisodeFilters(ep, filters) {
      if (filters.workId) {
        const tokens = filters.workId.split(/[\s,，]+/).filter(Boolean);
        if (!tokens.some((token) => ep.id.includes(token))) return false;
      }
      if (filters.source && ep.source !== filters.source) return false;
      if (filters.tag && ep.tag !== filters.tag) return false;
      if (filters.statuses.length && !filters.statuses.includes(ep.status)) return false;
      return true;
    }

    function renderSelect(options, value, attrs, className = "") {
      return `<select class="table-select ${className}" ${attrs}>${options.map((option) =>
        `<option value="${escapeAttr(option)}" ${option === value ? "selected" : ""}>${escapeHtml(option)}</option>`
      ).join("")}</select>`;
    }

    function renderControlOptions(options, value) {
      return options.map((option) =>
        `<option value="${escapeAttr(option)}" ${option === value ? "selected" : ""}>${escapeHtml(option)}</option>`
      ).join("");
    }

    function renderPoster(series) {
      return `<div class="poster">${series.posterUrl ? `<img src="${escapeAttr(series.posterUrl)}" alt="${escapeAttr(series.title)}海报" />` : "海报"}</div>`;
    }

    function renderTable() {
      const filters = getFilters();
      const visible = seriesList.filter((series) => matchesFilters(series, filters));
      $("resultCount").textContent = `共 ${visible.length} 部剧集 / ${visible.reduce((sum, item) => sum + item.episodes.length, 0)} 集`;
      $("seriesNavCount").textContent = `${visible.length} 部`;
      $("emptyState").hidden = visible.length > 0;

      if (!visible.some((series) => series.id === selectedSeriesId)) {
        selectedSeriesId = visible[0]?.id || null;
      }

      $("seriesNavList").innerHTML = visible.map((series) => `
        <button class="series-nav-item ${series.id === selectedSeriesId ? "active" : ""}" data-action="select-series" data-series="${series.id}">
          <strong title="${escapeAttr(series.title)}">${escapeHtml(series.title)}</strong>
          <small>${series.id}<br>${series.episodes.length} 集</small>
        </button>
      `).join("");

      const selected = visible.find((series) => series.id === selectedSeriesId);
      if (!selected) {
        $("selectedSummary").innerHTML = "";
        $("episodeTableBody").innerHTML = "";
        return;
      }

      $("selectedSummary").innerHTML = `
        <div class="detail-summary-card">
          ${renderPoster(selected)}
          <div class="detail-summary-main">
            <h3>${escapeHtml(selected.title)}</h3>
            <p>剧集 ID ${escapeHtml(selected.id)} · 作者 UID ${escapeHtml(selected.authorUid)} · 共 ${selected.episodes.length} 集</p>
            <p class="truncate" title="${escapeAttr(selected.desc || "暂无简介")}">${escapeHtml(selected.desc || "暂无简介")}</p>
          </div>
          <div class="detail-summary-actions">
            <button class="btn" data-action="edit-series" data-series="${selected.id}">编辑剧集信息</button>
            <button class="btn primary" data-action="append" data-series="${selected.id}">新增续集</button>
            <button class="btn danger" data-action="delete-series" data-series="${selected.id}">删除</button>
          </div>
        </div>
      `;

      const selectedEpisodes = selected.episodes.filter((ep) => matchesEpisodeFilters(ep, filters));
      $("emptyState").hidden = selectedEpisodes.length > 0;

      $("episodeTableBody").innerHTML = selectedEpisodes
        .slice()
        .sort((a, b) => a.episodeNo - b.episodeNo)
        .map((ep) => `
          <tr class="episode-row">
            <td class="col-id"><span class="truncate" title="${ep.id}">${ep.id}</span></td>
            <td class="col-preview"><div class="thumb ${ep.preview === "loading" ? "loading" : ""}">${ep.preview === "loading" ? "处理中" : "▶"}</div></td>
            <td class="col-episode">${renderEpisodeNoSelect(selected.id, ep)}</td>
            <td><div class="truncate inline-cell" data-action="inline-edit" data-field="title" data-series="${selected.id}" data-episode="${ep.id}" title="双击编辑：${escapeAttr(ep.title)}">${escapeHtml(ep.title)}</div></td>
            <td class="col-type">${renderSelect(typeOptions, ep.type, `data-action="change-episode-field" data-field="type" data-series="${selected.id}" data-episode="${ep.id}"`, "kind-select")}</td>
            <td class="col-status">${renderSelect(statusOptions, ep.status, `data-action="change-episode-status" data-series="${selected.id}" data-episode="${ep.id}" data-status="${escapeAttr(ep.status)}"`, "status-select")}</td>
            <td class="col-likes">${ep.likes || "-"}</td>
            <td>${renderSelect(tagOptions, ep.tag, `data-action="change-episode-field" data-field="tag" data-series="${selected.id}" data-episode="${ep.id}"`, "tag-select")}</td>
            <td class="col-source">${renderSelect(sourceOptions, ep.source, `data-action="change-episode-field" data-field="source" data-series="${selected.id}" data-episode="${ep.id}"`, "source-select")}</td>
            <td class="col-actions">
              <div class="episode-edit-actions">
                <button class="link-btn" data-action="edit-episode" data-series="${selected.id}" data-episode="${ep.id}">编辑</button>
                <button class="link-btn danger" data-action="delete-episode" data-series="${selected.id}" data-episode="${ep.id}">删除</button>
              </div>
            </td>
          </tr>
        `).join("");
    }

    function renderEpisodeNoSelect(seriesId, ep) {
      return `<select class="table-select" data-action="change-episode-no" data-series="${seriesId}" data-episode="${ep.id}">
        ${Array.from({ length: 30 }, (_, i) => `<option value="${i + 1}" ${ep.episodeNo === i + 1 ? "selected" : ""}>${episodeLabel(i + 1)}</option>`).join("")}
      </select>`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/"/g, "&quot;");
    }

    function openImport(mode, targetSeriesId = null) {
      importMode = mode;
      importTargetSeriesId = targetSeriesId;
      draftEpisodes = [];

      const target = seriesList.find((item) => item.id === targetSeriesId);
      if (mode === "append" && target) {
        $("importTitle").textContent = "新增续集";
        $("importSubtitle").textContent = `为《${target.title}》继续添加剧集，默认从最大集数后一集开始。`;
        $("seriesInfoSection").style.display = "none";
        const nextNo = Math.max(...target.episodes.map((ep) => ep.episodeNo)) + 1;
        draftEpisodes = [makeDraftEpisode(nextNo)];
      } else {
        $("importTitle").textContent = "导入作品";
        $("importSubtitle").textContent = "填写剧集信息后添加单集；单条默认第一集，多条自动形成同一剧集。";
        $("seriesInfoSection").style.display = "";
        $("seriesTitleInput").value = "";
        $("authorUidInput").value = "";
        $("seriesDescInput").value = "";
        $("posterInput").value = "";
        $("posterFileName").textContent = "未选择图片";
        $("posterInput").dataset.posterUrl = "";
        draftEpisodes = [makeDraftEpisode(1)];
      }

      renderDraftEpisodes();
      $("modalBackdrop").classList.add("show");
      $("importModal").classList.add("show");
    }

    function closeImport() {
      $("modalBackdrop").classList.remove("show");
      $("importModal").classList.remove("show");
    }

    function makeDraftEpisode(no, seed = "") {
      return {
        episodeNo: no,
        title: seed ? `${episodeLabel(no)} ${seed}` : "",
        uploadType: "url",
        url: "",
        fileName: ""
      };
    }

    function renderDraftEpisodes() {
      $("episodeEditorList").innerHTML = draftEpisodes.map((ep, index) => `
        <div class="episode-editor">
          <div class="form-group">
            <label>集数</label>
            <select class="control" data-draft-field="episodeNo" data-index="${index}">
              ${Array.from({ length: 30 }, (_, i) => `<option value="${i + 1}" ${ep.episodeNo === i + 1 ? "selected" : ""}>${episodeLabel(i + 1)}</option>`).join("")}
            </select>
          </div>
          <div class="form-group">
            <label>本集标题</label>
            <input class="control" data-draft-field="title" data-index="${index}" value="${escapeAttr(ep.title)}" placeholder="例如：霸道总裁雨夜现身" />
          </div>
          <div class="form-group">
            <label>上传视频</label>
            <div class="upload-cell">
              <div class="mini-tabs">
                <button class="${ep.uploadType === "url" ? "active" : ""}" data-upload-type="url" data-index="${index}" type="button">URL</button>
                <button class="${ep.uploadType === "file" ? "active" : ""}" data-upload-type="file" data-index="${index}" type="button">本地</button>
              </div>
              <input class="control" data-draft-field="url" data-index="${index}" value="${escapeAttr(ep.url)}" placeholder="粘贴抖音/小红书 URL" ${ep.uploadType === "file" ? "hidden" : ""} />
              <label class="compact-file" ${ep.uploadType === "url" ? "hidden" : ""}>
                <input type="file" accept="video/*" data-file-index="${index}" hidden />
                点击上传视频
              </label>
              <span class="upload-file-name" ${ep.uploadType === "url" || !ep.fileName ? "hidden" : ""}>${escapeHtml(ep.fileName)}</span>
            </div>
          </div>
          <button class="btn danger icon" data-remove-draft="${index}" title="删除该集">×</button>
        </div>
      `).join("");
    }

    function syncDraftField(target) {
      const index = Number(target.dataset.index);
      const field = target.dataset.draftField;
      if (!Number.isInteger(index) || !field) return;
      draftEpisodes[index][field] = field === "episodeNo" ? Number(target.value) : target.value;
    }

    function getAppendStartNo() {
      if (importMode !== "append") return 1;
      const target = seriesList.find((item) => item.id === importTargetSeriesId);
      return target ? Math.max(...target.episodes.map((ep) => ep.episodeNo)) + 1 : 1;
    }

    function submitImport() {
      draftEpisodes = draftEpisodes.map((ep) => ({
        episodeNo: Number(ep.episodeNo),
        title: ep.title.trim(),
        uploadType: ep.uploadType,
        url: ep.url.trim(),
        fileName: ep.fileName.trim()
      }));

      if (!draftEpisodes.length) {
        showToast("请至少添加一集");
        return;
      }
      if (draftEpisodes.some((ep) => !ep.title)) {
        showToast("请补全每集的本集标题");
        return;
      }
      if (draftEpisodes.some((ep) => ep.uploadType === "url" && !ep.url)) {
        showToast("URL 导入的剧集需要填写视频 URL");
        return;
      }
      if (draftEpisodes.some((ep) => ep.uploadType === "file" && !ep.fileName)) {
        showToast("本地上传的剧集需要选择视频文件");
        return;
      }
      const noSet = new Set();
      for (const ep of draftEpisodes) {
        if (noSet.has(ep.episodeNo)) {
          showToast("剧集列表中存在重复集数");
          return;
        }
        noSet.add(ep.episodeNo);
      }

      if (importMode === "append") {
        const target = seriesList.find((item) => item.id === importTargetSeriesId);
        if (!target) return;
        const existing = new Set(target.episodes.map((ep) => ep.episodeNo));
        if (draftEpisodes.some((ep) => existing.has(ep.episodeNo))) {
          showToast("该集数已存在，请修改集数或先删除原集");
          return;
        }
        target.episodes.push(...draftEpisodes.map((ep) => ({
          id: createWorkId(),
          episodeNo: ep.episodeNo,
          title: ep.title,
          type: "首创",
          status: "审核中",
          likes: 0,
          tag: "剧场_手动上传_ug创作者",
          source: "ugc",
          preview: "loading"
        })));
        selectedSeriesId = target.id;
        showToast("续集已加入审核队列");
      } else {
        const title = $("seriesTitleInput").value.trim();
        const authorUid = $("authorUidInput").value.trim();
        if (!title || !authorUid) {
          showToast("请补全剧集标题和作者 UID");
          return;
        }
        const newSeriesId = `S${Date.now()}`;
        seriesList.unshift({
          id: newSeriesId,
          title,
          authorUid,
          desc: $("seriesDescInput").value.trim(),
          posterName: $("posterFileName").textContent === "未选择图片" ? "" : $("posterFileName").textContent,
          posterUrl: $("posterInput").dataset.posterUrl || "",
          expanded: true,
          episodes: draftEpisodes.map((ep) => ({
            id: createWorkId(),
            episodeNo: ep.episodeNo,
            title: ep.title,
            type: "首创",
            status: "审核中",
            likes: 0,
            tag: "剧场_手动上传_ug创作者",
            source: "ugc",
            preview: "loading"
          }))
        });
        selectedSeriesId = newSeriesId;
        showToast("剧集已进入审核队列");
      }
      closeImport();
      renderTable();
    }

    function openConfirm(title, body, action) {
      confirmAction = action;
      $("confirmTitle").textContent = title;
      $("confirmBody").innerHTML = body;
      $("modalBackdrop").classList.add("show");
      $("confirmModal").classList.add("show");
    }

    function closeConfirm() {
      confirmAction = null;
      $("confirmModal").classList.remove("show");
      if (!$("importModal").classList.contains("show") && !$("episodeEditModal").classList.contains("show")) {
        $("modalBackdrop").classList.remove("show");
      }
    }

    function setEpisodeEditUploadMode(mode) {
      $("episodeEditModal").dataset.uploadType = mode;
      $("episodeEditModal").querySelectorAll("[data-episode-edit-upload-type]").forEach((button) => {
        button.classList.toggle("active", button.dataset.episodeEditUploadType === mode);
      });
      $("editEpisodeVideoUrl").hidden = mode !== "url";
      $("editEpisodeFileLabel").hidden = mode !== "file";
      $("editEpisodeVideoName").hidden = mode !== "file" || !$("editEpisodeVideoFile").dataset.fileName;
    }

    function openEpisodeEdit(seriesId, episodeId) {
      const series = seriesList.find((item) => item.id === seriesId);
      const ep = series?.episodes.find((item) => item.id === episodeId);
      if (!series || !ep) return;

      editingEpisodeRef = { seriesId, episodeId };
      $("editEpisodeNo").innerHTML = Array.from({ length: 30 }, (_, i) =>
        `<option value="${i + 1}" ${ep.episodeNo === i + 1 ? "selected" : ""}>${episodeLabel(i + 1)}</option>`
      ).join("");
      $("editEpisodeTitle").value = ep.title;
      $("editEpisodeType").innerHTML = renderControlOptions(typeOptions, ep.type);
      $("editEpisodeStatus").innerHTML = renderControlOptions(statusOptions, ep.status);
      $("editEpisodeTag").innerHTML = renderControlOptions(tagOptions, ep.tag);
      $("editEpisodeSource").innerHTML = renderControlOptions(sourceOptions, ep.source);
      $("editEpisodeVideoUrl").value = "";
      $("editEpisodeVideoFile").value = "";
      $("editEpisodeVideoFile").dataset.fileName = "";
      $("editEpisodeVideoName").textContent = "";
      setEpisodeEditUploadMode("url");
      $("modalBackdrop").classList.add("show");
      $("episodeEditModal").classList.add("show");
    }

    function closeEpisodeEdit() {
      editingEpisodeRef = null;
      $("episodeEditModal").classList.remove("show");
      if (!$("importModal").classList.contains("show") && !$("confirmModal").classList.contains("show")) {
        $("modalBackdrop").classList.remove("show");
      }
    }

    function saveEpisodeEdit() {
      if (!editingEpisodeRef) return;
      const series = seriesList.find((item) => item.id === editingEpisodeRef.seriesId);
      const ep = series?.episodes.find((item) => item.id === editingEpisodeRef.episodeId);
      if (!series || !ep) return;

      const nextNo = Number($("editEpisodeNo").value);
      const nextTitle = $("editEpisodeTitle").value.trim();
      if (!nextTitle) {
        showToast("请填写本集标题");
        return;
      }
      if (series.episodes.some((item) => item.id !== ep.id && item.episodeNo === nextNo)) {
        showToast("该集数已存在，请选择其他集数");
        return;
      }

      ep.episodeNo = nextNo;
      ep.title = nextTitle;
      ep.type = $("editEpisodeType").value;
      ep.status = $("editEpisodeStatus").value;
      ep.tag = $("editEpisodeTag").value;
      ep.source = $("editEpisodeSource").value;
      ep.preview = ep.status === "审核中" || ep.status === "发布失败" ? "loading" : "video";

      const uploadType = $("episodeEditModal").dataset.uploadType;
      const replacementUrl = $("editEpisodeVideoUrl").value.trim();
      const replacementFile = $("editEpisodeVideoFile").dataset.fileName || "";
      if (uploadType === "url" && replacementUrl) {
        ep.uploadType = "url";
        ep.url = replacementUrl;
        ep.fileName = "";
        ep.preview = "loading";
      }
      if (uploadType === "file" && replacementFile) {
        ep.uploadType = "file";
        ep.fileName = replacementFile;
        ep.url = "";
        ep.preview = "loading";
      }

      closeEpisodeEdit();
      renderTable();
      showToast("单集信息已保存");
    }

    function openEdit(seriesId) {
      const series = seriesList.find((item) => item.id === seriesId);
      if (!series) return;
      editingRef = { seriesId };
      $("editSeriesTitle").value = series.title;
      $("editSeriesId").value = series.id;
      $("editAuthorUid").value = series.authorUid;
      $("editSeriesDesc").value = series.desc || "";
      $("editPosterInput").value = "";
      $("editPosterInput").dataset.posterName = "";
      $("editPosterInput").dataset.posterUrl = "";
      $("editPosterFileName").textContent = series.posterName || "未选择新图片";
      $("drawerBackdrop").classList.add("show");
      $("editDrawer").classList.add("show");
    }

    function closeEdit() {
      editingRef = null;
      $("drawerBackdrop").classList.remove("show");
      $("editDrawer").classList.remove("show");
    }

    function saveEdit() {
      if (!editingRef) return;
      const series = seriesList.find((item) => item.id === editingRef.seriesId);
      if (!series) return;
      const title = $("editSeriesTitle").value.trim();
      const authorUid = $("editAuthorUid").value.trim();
      if (!title || !authorUid) {
        showToast("请补全剧集标题和作者 UID");
        return;
      }
      series.title = title;
      series.authorUid = authorUid;
      series.desc = $("editSeriesDesc").value.trim();
      if ($("editPosterInput").dataset.posterName) {
        series.posterName = $("editPosterInput").dataset.posterName;
        series.posterUrl = $("editPosterInput").dataset.posterUrl;
      }
      closeEdit();
      renderTable();
      showToast("剧集信息已保存");
    }

    function findEpisode(seriesId, episodeId) {
      const series = seriesList.find((item) => item.id === seriesId);
      const ep = series?.episodes.find((item) => item.id === episodeId);
      return { series, ep };
    }

    function startInlineEdit(cell) {
      const { series, ep } = findEpisode(cell.dataset.series, cell.dataset.episode);
      const field = cell.dataset.field;
      if (!series || !ep || !field || cell.querySelector("input")) return;
      const previous = ep[field] || "";
      const input = document.createElement("input");
      input.className = "inline-input";
      input.value = previous;
      input.setAttribute("aria-label", "本集标题");
      cell.textContent = "";
      cell.appendChild(input);
      input.focus();
      input.select();

      const commit = () => {
        const next = input.value.trim();
        ep[field] = next || previous;
        renderTable();
        showToast("单集信息已保存");
      };
      const cancel = () => renderTable();

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") commit();
        if (event.key === "Escape") cancel();
      });
      input.addEventListener("blur", commit, { once: true });
    }

    $("openImportBtn").addEventListener("click", () => openImport("create"));
    $("closeImportBtn").addEventListener("click", closeImport);
    $("cancelImportBtn").addEventListener("click", closeImport);
    $("addEpisodeLineBtn").addEventListener("click", () => {
      draftEpisodes.push(makeDraftEpisode(getAppendStartNo() + draftEpisodes.length));
      renderDraftEpisodes();
    });
    $("posterInput").addEventListener("change", (event) => {
      const file = event.target.files?.[0];
      $("posterFileName").textContent = file ? file.name : "未选择图片";
      $("posterInput").dataset.posterUrl = file ? URL.createObjectURL(file) : "";
    });
    $("episodeEditorList").addEventListener("input", (event) => syncDraftField(event.target));
    $("episodeEditorList").addEventListener("change", (event) => syncDraftField(event.target));
    $("episodeEditorList").addEventListener("click", (event) => {
      const uploadType = event.target.dataset.uploadType;
      if (uploadType) {
        const index = Number(event.target.dataset.index);
        draftEpisodes[index].uploadType = uploadType;
        renderDraftEpisodes();
        return;
      }
      const index = event.target.dataset.removeDraft;
      if (index === undefined) return;
      draftEpisodes.splice(Number(index), 1);
      renderDraftEpisodes();
    });
    $("episodeEditorList").addEventListener("change", (event) => {
      const index = Number(event.target.dataset.fileIndex);
      if (!Number.isInteger(index) || !event.target.files?.length) return;
      const file = event.target.files[0];
      draftEpisodes[index].fileName = file.name;
      if (!draftEpisodes[index].title.trim()) {
        draftEpisodes[index].title = file.name.replace(/\.[^.]+$/, "");
      }
      renderDraftEpisodes();
    });
    $("submitImportBtn").addEventListener("click", submitImport);
    $("applyFiltersBtn").addEventListener("click", renderTable);
    $("resetFiltersBtn").addEventListener("click", () => {
      ["filterWorkId", "filterUid", "filterSeriesId"].forEach((id) => $(id).value = "");
      $("filterScene").value = "剧场";
      $("filterSource").value = "";
      $("filterTag").value = "";
      $("statusFilters").querySelectorAll("input").forEach((item) => item.checked = false);
      renderTable();
    });
    ["filterScene", "filterWorkId", "filterUid", "filterSeriesId", "filterSource", "filterTag"].forEach((id) => {
      $(id).addEventListener("input", renderTable);
      $(id).addEventListener("change", renderTable);
    });
    $("statusFilters").addEventListener("change", renderTable);
    $("flatViewBtn").addEventListener("click", () => showToast("Demo 当前聚焦剧集视图，单集视图作为后续扩展"));
    $("collapseHintBtn").addEventListener("click", () => showToast("筛选区在 demo 中保持展开"));
    $("toggleSeriesNavBtn").addEventListener("click", () => {
      isSeriesNavCompact = !isSeriesNavCompact;
      renderSeriesNavMode();
    });

    $("seriesNavList").addEventListener("click", (event) => {
      const actionEl = event.target.closest("[data-action='select-series']");
      if (!actionEl) return;
      selectedSeriesId = actionEl.dataset.series;
      renderTable();
    });

    $("selectedSummary").addEventListener("click", (event) => {
      const actionEl = event.target.closest("[data-action]");
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      const seriesId = actionEl.dataset.series;
      const series = seriesList.find((item) => item.id === seriesId);
      if (!series) return;

      if (action === "edit-series") {
        openEdit(seriesId);
      }
      if (action === "append") {
        openImport("append", seriesId);
      }
      if (action === "delete-series") {
        const published = series.episodes.some((ep) => ep.status === "公开可见");
        openConfirm(
          "删除剧集",
          `确认删除《${escapeHtml(series.title)}》及其全部 ${series.episodes.length} 集吗？${published ? "<br><strong>其中包含已发布视频，删除后剧场中对应内容将不可见。</strong>" : ""}`,
          () => {
            seriesList = seriesList.filter((item) => item.id !== seriesId);
            renderTable();
            showToast("剧集已删除");
          }
        );
      }
    });

    $("episodeTableBody").addEventListener("change", (event) => {
      const target = event.target;
      const action = target.dataset.action;
      const seriesId = target.dataset.series;
      const episodeId = target.dataset.episode;
      const series = seriesList.find((item) => item.id === seriesId);
      if (!series) return;

      if (action === "change-episode-no") {
        const ep = series.episodes.find((item) => item.id === episodeId);
        const nextNo = Number(target.value);
        if (!ep) return;
        if (series.episodes.some((item) => item.id !== episodeId && item.episodeNo === nextNo)) {
          showToast("该集数已存在，请选择其他集数");
          renderTable();
          return;
        }
        ep.episodeNo = nextNo;
        renderTable();
        showToast("集数已更新");
      }
      if (action === "change-episode-status") {
        const ep = series.episodes.find((item) => item.id === episodeId);
        if (!ep) return;
        ep.status = target.value;
        ep.preview = target.value === "审核中" || target.value === "发布失败" ? "loading" : "video";
        renderTable();
        showToast("状态已更新");
      }
      if (action === "change-episode-field") {
        const ep = series.episodes.find((item) => item.id === episodeId);
        const field = target.dataset.field;
        if (!ep || !field) return;
        ep[field] = target.value;
        renderTable();
        showToast("单集信息已更新");
      }
    });

    $("episodeTableBody").addEventListener("dblclick", (event) => {
      const cell = event.target.closest("[data-action='inline-edit']");
      if (cell) startInlineEdit(cell);
    });

    $("episodeTableBody").addEventListener("click", (event) => {
      const actionEl = event.target.closest("[data-action]");
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      const seriesId = actionEl.dataset.series;
      const episodeId = actionEl.dataset.episode;
      const series = seriesList.find((item) => item.id === seriesId);
      if (!series) return;

      if (action === "edit-episode") {
        openEpisodeEdit(seriesId, episodeId);
      }

      if (action === "delete-episode") {
        const ep = series.episodes.find((item) => item.id === episodeId);
        if (!ep) return;
        openConfirm(
          "删除单集",
          `确认删除${episodeLabel(ep.episodeNo)}《${escapeHtml(ep.title)}》吗？删除后该集视频将从当前剧集移除。${ep.status === "公开可见" ? "<br><strong>该集公开可见，删除后剧场中将不可见。</strong>" : ""}`,
          () => {
            series.episodes = series.episodes.filter((item) => item.id !== episodeId);
            if (!series.episodes.length) {
              seriesList = seriesList.filter((item) => item.id !== seriesId);
            }
            renderTable();
            showToast("单集已删除");
          }
        );
      }
    });

    $("closeConfirmBtn").addEventListener("click", closeConfirm);
    $("cancelConfirmBtn").addEventListener("click", closeConfirm);
    $("okConfirmBtn").addEventListener("click", () => {
      if (confirmAction) confirmAction();
      closeConfirm();
    });
    $("closeEpisodeEditBtn").addEventListener("click", closeEpisodeEdit);
    $("cancelEpisodeEditBtn").addEventListener("click", closeEpisodeEdit);
    $("saveEpisodeEditBtn").addEventListener("click", saveEpisodeEdit);
    $("episodeEditModal").addEventListener("click", (event) => {
      const button = event.target.closest("[data-episode-edit-upload-type]");
      if (button) setEpisodeEditUploadMode(button.dataset.episodeEditUploadType);
    });
    $("editEpisodeVideoFile").addEventListener("change", (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      $("editEpisodeVideoFile").dataset.fileName = file.name;
      $("editEpisodeVideoName").textContent = file.name;
      $("editEpisodeVideoName").hidden = false;
    });
    $("closeDrawerBtn").addEventListener("click", closeEdit);
    $("cancelEditBtn").addEventListener("click", closeEdit);
    $("drawerBackdrop").addEventListener("click", closeEdit);
    $("saveEditBtn").addEventListener("click", saveEdit);
    $("editPosterInput").addEventListener("change", (event) => {
      const file = event.target.files?.[0];
      if (!file || !editingRef) return;
      $("editPosterInput").dataset.posterName = file.name;
      $("editPosterInput").dataset.posterUrl = URL.createObjectURL(file);
      $("editPosterFileName").textContent = file.name;
    });

    renderSeriesNavMode();
    renderTable();
  </script>
</body>
</html>
